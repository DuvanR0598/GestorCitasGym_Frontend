<div class="body">
    <form (ngSubmit) = "formSubmit()" class="my-form">
        <div class="login-welcome-row">
            <a href="#" title="Logo"> 
                <img src="../../../assets/logoEnergym.png" alt="Logo" class="logo">
            </a>
            <h1 class="welcome-message">Bienvenido de nuevo</h1>
            <p class="welcome-message">¡Por favor ingresa tus datos!</p>
        </div>

        <div class="input__wrapper">
            <input [(ngModel)] = "loginData.username" name="username" required matInput placeholder="Digita tu usuario" class="input__field">
            <label for="username" class="input__label">Usuario</label>
            <svg class="input__icon" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"
                stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"></path>
                <path d="M16 12v1.5a2.5 2.5 0 0 0 5 0v-1.5a9 9 0 1 0 -5.5 8.28"></path>
            </svg>
        </div>
        
        <div class="input__wrapper">
            <input [(ngModel)] = "loginData.password" name="password" required type="password" matInput class="input__field" 
                placeholder="Digite su contraseña"
                title="Mínimo 6 caracteres al menos 1 alfabeto y 1 número"
                pattern="^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$" autocomplete="off">
            <label for="password" class="input__label">Contraseña</label>
            <svg class="input__icon" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 30 30"
                stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                <path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2v-6z"></path>
                <path d="M11 16a1 1 0 1 0 2 0a1 1 0 0 0 -2 0"></path>
                <path d="M8 11v-4a4 4 0 1 1 8 0v4"></path>
            </svg>
        </div>
        <button type="submit" class="my-form__button">Ingresar</button>
        <div class="socials-row">
            <a href="#" title="Use Google">
                <img src="../../../assets/logoGoogle.png" alt="Google">
                Iniciar sesión con Google</a>
        </div>
        <div class="my-form__actions">
            <div class="my-form__row">
                <span>¿No tienes una cuenta?</span>
                <a href="/signup" title="Create Account">Inscribirse</a>
            </div>
        </div>
    </form>

    <script src="script.js"></script>
</div>
